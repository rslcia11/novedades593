# Publica el sitio en GitHub Pages cada vez que cambia la rama principal.
# Requisito (una sola vez): Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Guía oficial: https://docs.astro.build/en/guides/deploy/github/
name: Desplegar en GitHub Pages

on:
  push:
    branches: [claude/confident-hamilton-ni5yb0]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez; no se cancela uno en curso para no dejar el sitio a medias.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Da la URL pública y la subcarpeta del sitio (por ejemplo /novedades593, o / con dominio propio).
      - name: Leer la configuración de Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Instalar dependencias
        run: npm ci

      - name: Construir el sitio
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Revisar enlaces con la subcarpeta real
        run: npm run test:links
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
