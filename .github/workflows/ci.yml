# Revisa cada cambio antes de publicarlo: estilo, tipos, pruebas, enlaces y pruebas en navegador.
name: CI

on:
  push:
    branches: [claude/confident-hamilton-ni5yb0]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Tipos (astro check)
        run: npm run check

      - name: Pruebas unitarias
        run: npm test

      - name: Construir el sitio
        run: npm run build

      - name: Enlaces y metadatos
        run: npm run test:links

      # Igual que en GitHub Pages: el sitio vive en una subcarpeta y ningún enlace puede ignorarla.
      - name: Enlaces con el sitio en una subcarpeta
        run: |
          BASE_PATH=/novedades593 SITE_URL=https://example.github.io npm run build
          BASE_PATH=/novedades593 npm run test:links
          npm run build

      - name: Instalar navegador para las pruebas
        run: npx playwright install --with-deps chromium

      - name: Pruebas en navegador
        run: npm run test:e2e

      - name: Guardar reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
